<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batalha de Hits</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1c1f26;
            --text-color: #ffffff;
            --accent-color: #ff2a5f;
            --hover-color: #2a2e38;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 5px;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
        }

        h2 {
            font-weight: 300;
            color: #8b92a5;
            margin-bottom: 20px;
            text-align: center;
        }

        .restart-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(28, 31, 38, 0.8);
            color: #8b92a5;
            border: 1px solid #8b92a5;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .restart-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* SELETOR DE TEMAS (LISTAS) */
        .theme-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            max-width: 900px;
        }

        .theme-btn {
            background-color: #2a2e38;
            color: #fff;
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .theme-btn:hover {
            background-color: #3a3f4c;
            transform: scale(1.05);
        }

        .theme-btn.active {
            background-color: var(--accent-color);
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

        .undo-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .undo-btn:hover:not(:disabled) {
            background-color: #555;
        }

        .undo-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ARENA FIXA */
        .arena {
            width: 100%;
            min-height: 600px; 
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        .match-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1000px;
            width: 100%;
        }

        .vs-badge {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            background: var(--accent-color);
            padding: 20px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.4);
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            width: 320px;
            height: 560px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border 0.3s ease;
            border: 2px solid transparent;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        .card:hover {
            transform: translateY(-8px);
            border: 2px solid var(--accent-color);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background-color: #111;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
            width: 100%;
        }

        .song-title {
            font-size: 22px;
            font-weight: bold;
            margin: 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .song-artist {
            font-size: 16px;
            color: #8b92a5;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
            outline: none;
        }

        .vote-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 15px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: auto;
        }

        .vote-btn:hover {
            background-color: #ff4d79;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4);
        }

        #loading {
            display: none;
            font-size: 24px;
            color: var(--accent-color);
            font-weight: bold;
            position: absolute; 
            animation: pulse 1s infinite alternate;
            text-align: center;
            z-index: 50;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        #winner-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ESTILOS DO MATA-MATA */
        #bracket-ui {
            margin-top: 40px;
            width: 100%;
            max-width: 1400px;
            background: #15181e;
            padding: 30px 10px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; 
        }

        #bracket-ui h3 {
            text-align: center;
            color: #8b92a5;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .scroll-hint {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .bracket-board {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            height: 850px;
            min-width: 1000px;
        }

        .bracket-column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            padding: 0 5px;
        }

        .bracket-column-title {
            font-size: 12px;
            color: #777;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            height: 20px;
        }

        .bracket-slot {
            background-color: #2a2e38;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            border: 1px solid #3a3f4c;
            position: relative;
            transition: 0.2s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-weight: bold;
            font-size: 12px;
        }

        .bracket-slot.filled {
            border-color: var(--accent-color);
            cursor: pointer;
            color: transparent; 
        }

        .bracket-slot.filled:hover {
            transform: scale(1.8);
            z-index: 50;
            box-shadow: 0 0 15px var(--accent-color);
            border-radius: 8px;
        }

        .bracket-slot .tooltip {
            visibility: hidden;
            background-color: #fff;
            color: #000;
            text-align: center;
            padding: 8px 12px;
            border-radius: 6px;
            position: absolute;
            z-index: 100;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            white-space: normal;
            width: max-content;
            max-width: 160px;
            font-size: 13px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        .bracket-slot .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        .bracket-slot.filled:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .bracket-column:first-child .tooltip { left: 0; transform: translateX(0); }
        .bracket-column:first-child .tooltip::after { left: 15px; margin-left: 0; }
        .bracket-column:last-child .tooltip { left: auto; right: 0; transform: translateX(0); }
        .bracket-column:last-child .tooltip::after { left: auto; right: 15px; margin-left: 0; }

        /* ========================================= */
        /* RESPONSIVIDADE PARA CELULARES E TABLETS */
        /* ========================================= */
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; margin-top: 40px; }
            h2 { font-size: 1.2em; }
            .restart-btn { top: 10px; right: 10px; padding: 6px 12px; font-size: 12px; }
            .arena { min-height: auto; padding-bottom: 20px; }
            .match-container { flex-direction: column; gap: 15px; }
            .card { width: 100%; max-width: 320px; height: auto; min-height: 480px; }
            .card img { height: 250px; }
            .vs-badge { font-size: 20px; padding: 10px; z-index: 10; margin: -20px 0; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
            .scroll-hint { display: block; }
            .bracket-board { height: 600px; }
            #winner-container .card { width: 100%; max-width: 320px; height: auto; transform: scale(1); }
            #winner-container .card img { height: 300px !important; }
        }
    </style>
</head>
<body>

    <button class="restart-btn" onclick="restartTournament()">🔄 Reiniciar Tudo</button>

    <h1 id="main-title">Batalha de Hits: Anos 2000 e 2010</h1>

    <div class="theme-selector">
        <button class="theme-btn" onclick="changeTheme('1980e1990.json', this, 'Anos 80 e 90')">Anos 80 e 90</button>
        <button class="theme-btn" onclick="changeTheme('rock.json', this, 'Rock')">Rock</button>
        <button class="theme-btn" onclick="changeTheme('divaspop.json', this, 'Divas Pop')">Divas Pop</button>
        <button class="theme-btn active" onclick="changeTheme('2000e2010.json', this, 'Anos 2000 e 2010')">Anos 2000 e 2010</button>
        <button class="theme-btn" onclick="changeTheme('funk.json', this, 'Funk')">Funk</button>
        <button class="theme-btn" onclick="changeTheme('brasil.json', this, 'Músicas Brasileiras')">Brasileiras</button>
    </div>

    <h2 id="round-title">Carregando as músicas...</h2>

    <div class="controls">
        <button class="undo-btn" id="undo-btn" onclick="undoVote()" disabled>⟲ Desfazer Última Escolha</button>
    </div>

    <div class="arena">
        <div id="loading">Buscando músicas na internet... 🎧</div>

        <div class="match-container" id="match-container"></div>

        <div id="winner-container">
            <h1 style="color: gold; text-shadow: 0 0 10px rgba(255,215,0,0.5);">🏆 A MELHOR MÚSICA 🏆</h1>
            <div id="winner-card" style="margin-top: 10px;"></div>
        </div>
    </div>

    <div id="bracket-ui">
        <h3>Quadro de Músicas</h3>
        <p class="scroll-hint">👉 Deslize para os lados para ver o quadro completo 👈</p>
        <div class="bracket-board" id="bracket-board"></div>
    </div>

    <script>
        let bracket = [ [], [], [], [], [], [], [] ]; 
        let currentRoundIdx = 0; 
        let matchIndex = 0;      
        let historyStack = [];   
        
        let currentThemeFile = '2000e2010.json';

        const matchContainer = document.getElementById('match-container');
        const roundTitle = document.getElementById('round-title');
        const loadingText = document.getElementById('loading');
        const undoBtn = document.getElementById('undo-btn');
        const winnerContainer = document.getElementById('winner-container');

        // Altera o tema atual se o usuário confirmar
        function changeTheme(file, btnElement, themeName) {
            if (confirm(`Alterar para a lista "${themeName}" irá apagar a batalha atual e reiniciá-la. Tem certeza?`)) {
                // Atualiza os botões visualmente
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
                
                // Atualiza o Título e o Arquivo JSON alvo
                document.getElementById('main-title').innerText = `Batalha de Hits: ${themeName}`;
                currentThemeFile = file;
                
                initTournament();
            }
        }

        // Função Principal para Carregar JSON e Iniciar/Reiniciar
        async function initTournament() {
            // Limpeza Total de Variáveis de Estado
            bracket = [ [], [], [], [], [], [], [] ];
            currentRoundIdx = 0;
            matchIndex = 0;
            historyStack = [];
            
            // Restaura Visuais da Arena
            undoBtn.disabled = true;
            winnerContainer.style.display = 'none';
            roundTitle.style.display = 'block';
            matchContainer.innerHTML = '';
            document.getElementById('bracket-board').innerHTML = '';

            loadingText.style.display = 'block';
            loadingText.innerText = "Carregando lista de músicas... 📂";
            loadingText.style.color = "var(--accent-color)";
            
            matchContainer.style.opacity = '0.3';
            matchContainer.style.pointerEvents = 'none';
            
            try {
                const response = await fetch(currentThemeFile);
                
                if (!response.ok) {
                    throw new Error("Erro ao carregar o arquivo.");
                }
                
                const initialSongs = await response.json();
                
                // Embaralha as músicas e joga na primeira rodada
                bracket[0] = [...initialSongs].sort(() => Math.random() - 0.5); 
                
                loadingText.innerText = "Buscando músicas na internet... 🎧";
                loadingText.style.display = 'none';
                renderMatch();

            } catch (error) {
                console.error("Erro no JSON:", error);
                loadingText.innerText = `Erro ao carregar o arquivo '${currentThemeFile}'!\nCertifique-se de que ele foi criado e que o site está num servidor local.`;
                loadingText.style.color = "red";
            }
        }

        document.addEventListener('play', function(e) {
            const audios = document.getElementsByTagName('audio');
            for (let i = 0; i < audios.length; i++) {
                if (audios[i] !== e.target) audios[i].pause();
            }
        }, true);

        // O botão superior de reiniciar agora roda o Init sem recarregar a página toda
        function restartTournament() {
            if (confirm("Tem certeza que deseja apagar a progressão e iniciar este torneio do zero?")) {
                initTournament();
            }
        }

async function fetchSongInfo(song) {
            if (song.loaded) return song; 
            
            const queryFull = encodeURIComponent(`${song.title} ${song.artist}`);
            const queryTitleOnly = encodeURIComponent(`${song.title}`);
            
            // TENTATIVA 1: iTunes (Busca Exata - Título + Artista)
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${queryFull}&entity=song&limit=1`);
                const data = await response.json();
                
                if (data.results.length > 0 && data.results[0].previewUrl) {
                    song.img = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                    song.audio = data.results[0].previewUrl;
                    song.loaded = true;
                    return song;
                }
            } catch (error) {
                console.warn(`iTunes (Exata) falhou para ${song.title}.`);
            }

            // TENTATIVA 2: iTunes (Busca Ampla - Apenas Título)
            // Resolve o problema de feats não creditados corretamente que bugam a API
            try {
                const response2 = await fetch(`https://itunes.apple.com/search?term=${queryTitleOnly}&entity=song&limit=5`);
                const data2 = await response2.json();
                
                // Pega a primeira música da lista que tenha áudio liberado
                const track = data2.results.find(t => t.previewUrl);
                if (track) {
                    song.img = track.artworkUrl100.replace('100x100bb', '600x600bb');
                    song.audio = track.previewUrl;
                    song.loaded = true;
                    return song;
                }
            } catch (error) {
                console.warn(`iTunes (Ampla) falhou para ${song.title}.`);
            }

            // TENTATIVA 3: Deezer com Proxy (Plano de Salvação)
            // O proxy é OBRIGATÓRIO aqui, senão o navegador bloqueia a requisição (Erro de CORS)
            try {
                const deezerUrl = encodeURIComponent(`https://api.deezer.com/search?q=${queryFull}`);
                // Usando um proxy diferente, focado em alta velocidade
                const proxyUrl = `https://api.allorigins.win/raw?url=${deezerUrl}`; 
                
                const deezerResponse = await fetch(proxyUrl);
                const deezerData = await deezerResponse.json();
                
                if (deezerData.data && deezerData.data.length > 0 && deezerData.data[0].preview) {
                    song.img = deezerData.data[0].album.cover_xl; 
                    song.audio = deezerData.data[0].preview;      
                    song.loaded = true;
                    return song;
                }
            } catch (error) {
                console.warn(`Deezer falhou para ${song.title}. Música oficialmente inacessível nas APIs abertas.`);
            }

            // PLANO C: Fallback para não quebrar o layout
            song.img = '';
            song.audio = '';
            song.loaded = true;
            return song;
        }

        function updateRoundTitle() {
            const totalRemaining = bracket[currentRoundIdx].length;
            const currentMatch = (matchIndex / 2) + 1;
            const totalMatches = totalRemaining / 2;
            
            const roundNames = ["Fase de 32", "Fase de 16", "Oitavas", "Quartas", "Semi-final", "Final"];
            
            if(currentRoundIdx < 6) {
                roundTitle.innerText = `${roundNames[currentRoundIdx]}: Duelo ${currentMatch} de ${totalMatches}`;
            }
        }

        function renderBracketUI() {
            const board = document.getElementById('bracket-board');
            board.innerHTML = '';

            const columnsConfig = [
                { r: 0, side: 'left' }, { r: 1, side: 'left' }, { r: 2, side: 'left' },
                { r: 3, side: 'left' }, { r: 4, side: 'left' }, { r: 5, side: 'left' },
                { r: 6, side: 'center' },
                { r: 5, side: 'right' }, { r: 4, side: 'right' }, { r: 3, side: 'right' },
                { r: 2, side: 'right' }, { r: 1, side: 'right' }, { r: 0, side: 'right' }
            ];

            const roundNames = ["Fase de 32", "Fase de 16", "Oitavas", "Quartas", "Semi-final", "Final", "Campeã"];
            const thumbSizes = [22, 32, 45, 60, 80, 100, 140]; 

            columnsConfig.forEach(colDef => {
                const col = document.createElement('div');
                col.className = 'bracket-column';
                
                const title = document.createElement('div');
                title.className = 'bracket-column-title';
                title.innerText = colDef.side === 'center' ? 'Vencedora' : roundNames[colDef.r];
                col.appendChild(title);

                const totalInRound = 64 / Math.pow(2, colDef.r);
                const itemsInCol = colDef.side === 'center' ? 1 : totalInRound / 2;
                const size = thumbSizes[colDef.r];

                for (let i = 0; i < itemsInCol; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'bracket-slot';
                    slot.style.width = size + 'px';
                    slot.style.height = size + 'px';

                    let index = colDef.side === 'left' ? i : (colDef.side === 'right' ? i + itemsInCol : 0);
                    const song = bracket[colDef.r][index];
                    
                    let isRevealed = true;
                    if (colDef.r === 0 && currentRoundIdx === 0 && index > matchIndex + 1) {
                        isRevealed = false;
                    }

                    if (song && isRevealed) {
                        slot.classList.add('filled');
                        
                        if (song.img) {
                            slot.style.backgroundImage = `url('${song.img}')`;
                        } else {
                            slot.style.backgroundImage = `url('https://ui-avatars.com/api/?background=ff2a5f&color=fff&font-size=0.4&name=${encodeURIComponent(song.title.charAt(0))}')`;
                        }
                        
                        slot.innerHTML = `<span class="tooltip">${song.title}<br><small style="font-weight:normal;">${song.artist}</small></span>`;
                    } else {
                        slot.classList.remove('filled');
                        slot.style.backgroundImage = 'none';
                        slot.innerHTML = "?";
                    }

                    col.appendChild(slot);
                }
                board.appendChild(col);
            });
        }

        async function renderMatch() {
            winnerContainer.style.display = 'none';
            roundTitle.style.display = 'block';

            renderBracketUI(); 
            
            if (bracket[6].length === 1) {
                showWinner(bracket[6][0]);
                return;
            }

            if (matchIndex >= bracket[currentRoundIdx].length) {
                currentRoundIdx++;
                matchIndex = 0;
            }

            updateRoundTitle();
            undoBtn.disabled = historyStack.length === 0;

            matchContainer.style.opacity = '0.3';
            matchContainer.style.pointerEvents = 'none';
            loadingText.style.display = 'block';

            const song1 = bracket[currentRoundIdx][matchIndex];
            const song2 = bracket[currentRoundIdx][matchIndex + 1];

            await Promise.all([fetchSongInfo(song1), fetchSongInfo(song2)]);

            loadingText.style.display = 'none';
            
            matchContainer.innerHTML = createCardHTML(song1, 1) + 
                                       `<div class="vs-badge">VS</div>` + 
                                       createCardHTML(song2, 2);
                                       
            matchContainer.style.opacity = '1';
            matchContainer.style.pointerEvents = 'auto';
            
            renderBracketUI();
        }

        function createCardHTML(song, choiceId) {
            const audioHtml = song.audio 
                ? `<audio controls controlsList="nodownload"><source src="${song.audio}" type="audio/mpeg"></audio>`
                : `<div style="height: 40px; color: #888; font-size:12px; margin-bottom: 15px; display:flex; align-items:center; justify-content:center;">Áudio indisponível</div>`;

            return `
                <div class="card">
                    <img src="${song.img || 'https://ui-avatars.com/api/?size=320&background=1c1f26&color=ff2a5f&font-size=0.5&name=' + song.title.charAt(0)}" alt="Capa">
                    <div class="card-info">
                        <div class="song-title" title="${song.title}">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    ${audioHtml}
                    <button class="vote-btn" onclick="processVote(${choiceId})">Votar Nesta</button>
                </div>
            `;
        }

        function processVote(choice) {
            document.querySelectorAll('audio').forEach(audio => audio.pause());

            historyStack.push({
                bracket: JSON.parse(JSON.stringify(bracket)), 
                currentRoundIdx: currentRoundIdx,
                matchIndex: matchIndex
            });

            const winner = choice === 1 ? bracket[currentRoundIdx][matchIndex] : bracket[currentRoundIdx][matchIndex + 1];
            bracket[currentRoundIdx + 1].push(winner);
            
            matchIndex += 2;
            renderMatch();
        }

        function undoVote() {
            if (historyStack.length === 0) return;
            const lastState = historyStack.pop();
            bracket = lastState.bracket;
            currentRoundIdx = lastState.currentRoundIdx;
            matchIndex = lastState.matchIndex;
            renderMatch();
        }

        function showWinner(song) {
            roundTitle.style.display = 'none';
            matchContainer.style.display = 'none';
            winnerContainer.style.display = 'flex';
            undoBtn.disabled = false; 

            document.getElementById('winner-card').innerHTML = `
                <div class="card" style="width: 350px; height: 600px; cursor: default; transform: scale(1.05); margin-top:20px; margin-bottom:20px;">
                    <img src="${song.img}" alt="Capa ${song.title}" style="height: 350px;">
                    <div class="card-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    ${song.audio ? `<audio controls style="margin-top:auto;"><source src="${song.audio}" type="audio/mpeg"></audio>` : ''}
                </div>
            `;
        }

        // Inicia o torneio
        initTournament();
    </script>
</body>
</html>
